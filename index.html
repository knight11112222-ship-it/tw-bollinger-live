<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <title>熱門看板｜台股布林通道順大逆小選股系統</title>
  <style>
    /* =========================================================================
       1. 設計系統與色彩變數 (深曜石黑金融終端風格 × 零外部 CDN)
       ========================================================================= */
    :root {
      --bg-base: #121212;
      --bg-surface: #1c1c1e;
      --bg-surface-2: #242427;
      --bg-pill: #1e1e22;
      --bg-nav: #161618;
      --bg-sheet: #18181b;
      --border-hairline: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.13);

      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;

      --gold: #f5a623;
      --gold-soft: rgba(245, 166, 35, 0.16);
      --gold-border: rgba(245, 166, 35, 0.42);

      /* 台股慣用色：紅漲買超、綠跌賣超 */
      --tw-up: #ef4444;
      --tw-up-soft: rgba(239, 68, 68, 0.16);
      --tw-down: #10b981;
      --tw-down-soft: rgba(16, 185, 129, 0.16);

      --blue: #38bdf8;
      --blue-soft: rgba(56, 189, 248, 0.15);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.16);

      --radius-card: 14px;
      --radius-pill: 999px;
      --nav-height: 62px;
      --topbar-height: 52px;

      --font-sans: "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .text-up { color: var(--tw-up) !important; }
    .text-down { color: var(--tw-down) !important; }
    .text-gold { color: var(--gold) !important; }
    .text-blue { color: var(--blue) !important; }
    .text-purple { color: var(--purple) !important; }
    .text-muted { color: var(--text-muted) !important; }

    /* 隱藏捲軸但保留平滑橫向滑動 */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* =========================================================================
       2. 主容器與頂部導覽列 (Sticky ~52px)
       ========================================================================= */
    .app-container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding-bottom: calc(var(--nav-height) + 18px + env(safe-area-inset-bottom, 0px));
      min-height: 100vh;
      position: relative;
    }

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 18, 18, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .topbar {
      max-width: 980px;
      margin: 0 auto;
      height: var(--topbar-height);
      padding: 0 12px;
      display: grid;
      grid-template-columns: 96px 1fr 112px;
      align-items: center;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .topbar-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(245, 166, 35, 0.65);
      transition: background 0.25s;
    }
    .live-dot.is-live {
      background: var(--tw-down);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      color: #e4e4e7;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }
    .icon-btn:active {
      transform: scale(0.93);
    }
    .icon-btn.active {
      color: var(--gold);
      background: var(--gold-soft);
    }

    .bell-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 99px;
      background: var(--tw-up);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
    }
    .bell-badge.show {
      display: inline-flex;
    }

    /* 滑動展開搜尋列 */
    .search-bar-wrap {
      max-width: 980px;
      margin: 0 auto;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.22s ease, opacity 0.2s ease, padding 0.22s ease;
      padding: 0 12px;
    }
    .search-bar-wrap.open {
      max-height: 58px;
      opacity: 1;
      padding: 4px 12px 10px;
    }
    .search-field {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1c1c1e;
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      padding: 0 12px;
      height: 40px;
    }
    .search-field:focus-within {
      border-color: var(--gold);
    }
    .search-field input {
      flex: 1;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    .search-field input::placeholder {
      color: var(--text-muted);
    }
    .search-clear {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      display: none;
    }
    .search-clear.show { display: inline-block; }

    /* 快速排序彈出選單 */
    .sort-popover {
      position: fixed;
      top: calc(var(--topbar-height) + 6px);
      left: 12px;
      z-index: 85;
      width: 215px;
      background: #202024;
      border: 1px solid var(--border-strong);
      border-radius: 13px;
      padding: 6px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
      display: none;
    }
    .sort-popover.open {
      display: block;
      animation: fadeDown 0.16s ease;
    }
    .sort-option {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sort-option:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .sort-option.active {
      background: var(--gold-soft);
      color: var(--gold);
      font-weight: 700;
    }

    /* =========================================================================
       3. 橫向分類篩選膠囊列 (Horizontal Pills)
       ========================================================================= */
    .pills-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 12px 6px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-pill {
      flex-shrink: 0;
      border: 1px solid var(--border-hairline);
      background: var(--bg-pill);
      color: var(--text-secondary);
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .filter-pill:hover {
      color: #fff;
      background: #26262b;
    }
    .filter-pill.active {
      background: var(--gold-soft);
      border-color: var(--gold-border);
      color: var(--gold);
    }
    .pill-count {
      font-size: 10.5px;
      font-family: var(--font-mono);
      opacity: 0.85;
    }

    /* 狀態副條 (顯示資料日期與排序資訊) */
    .sub-meta-bar {
      padding: 4px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .meta-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .meta-pill-amber {
      background: var(--gold-soft);
      color: var(--gold);
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 600;
    }
    .meta-pill-live {
      background: var(--tw-down-soft);
      color: var(--tw-down);
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 600;
    }

    /* =========================================================================
       4. 骨架屏載入動畫 (完全還原截圖深色雙欄卡片骨架)
       ========================================================================= */
    @keyframes shimmerPulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skel-shimmer {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 25%,
        rgba(255, 255, 255, 0.09) 50%,
